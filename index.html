<!doctype html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certificazione freeCodeCamp - Daniele Segreto</title>
    
    <!-- METADATI OPEN GRAPH PER LINKEDIN -->

    property="og:title"

<body>
